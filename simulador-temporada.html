<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulador de Reserva</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px auto;
    max-width: 600px;
  }

  label {
    margin-top: 12px;
    display: block;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
  }

  #total {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
  }

  #info-desconto {
    display: none;
    margin-top: 10px;
    font-size: 14px;
    color: #555;
  }
</style>
</head>

<body>

<h2>Simulador de Reserva</h2>

<label>Data de entrada</label>
<input type="date" id="dataEntrada">

<label>Horário de entrada</label>
<input type="time" id="entrada" value="14:00">

<label>Data de saída</label>
<input type="date" id="dataSaida">

<label>Horário de saída</label>
<input type="time" id="saida" value="13:00">

<label>Número de pessoas</label>
<input type="number" id="pessoas" min="1" value="1">

<div id="total">Total a pagar: R$ 0,00</div>
<div id="info-desconto">Valores calculados automaticamente</div>

<script>
  const entradaInput = document.getElementById('entrada');
  const saidaInput = document.getElementById('saida');
  const dataEntradaInput = document.getElementById('dataEntrada');
  const dataSaidaInput = document.getElementById('dataSaida');
  const pessoasInput = document.getElementById('pessoas');
  const totalDiv = document.getElementById('total');
  const descontoInfo = document.getElementById('info-desconto');

  /*
    🔔 AJUSTE GERAL DE VALOR 🔔
    Aumento percentual aplicado no valor final.
    Ex:
    0.3 = 30%
    0.5 = 50%
  */
  const ajustePercentualGeral = 0.5;

  /*
    🔔 DIFERENÇA DA 2ª PESSOA 🔔
    Acréscimo aplicado SOMENTE quando houver
    exatamente 2 pessoas reais.
    Ex: 0.1667 = 16,67%
  */
  const ajusteSegundaPessoa = 0.1667;

  function calcularValor() {
    if (!dataEntradaInput.value || !dataSaidaInput.value) {
      totalDiv.textContent = 'Total a pagar: R$ 0,00';
      descontoInfo.style.display = 'none';
      return;
    }

    const dataEntrada = new Date(dataEntradaInput.value);
    const dataSaida = new Date(dataSaidaInput.value);
    let pessoasReais = parseInt(pessoasInput.value) || 1;

    let diffTime = dataSaida - dataEntrada;
    let dias = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    if (dias < 1) dias = 1;

    if (entradaInput.value < "14:00") dias++;
    if (saidaInput.value > "13:00") dias++;
    if (dias < 2) dias = 2;

    // Valor base: R$ 50 por pessoa cobrada / dia
    let pessoasCobradas = pessoasReais === 1 ? 2 : pessoasReais;
    let valorBase = pessoasCobradas * 50 * dias;

    // Acréscimo SOMENTE para 2 pessoas reais
    if (pessoasReais === 2) {
      valorBase += valorBase * ajusteSegundaPessoa;
    }

    // Acréscimo geral
    valorBase += valorBase * ajustePercentualGeral;

    totalDiv.textContent =
      `Total a pagar: R$ ${valorBase.toFixed(2).replace('.', ',')}`;
    descontoInfo.style.display = 'block';
  }

  entradaInput.addEventListener('change', calcularValor);
  saidaInput.addEventListener('change', calcularValor);
  dataEntradaInput.addEventListener('change', calcularValor);
  dataSaidaInput.addEventListener('change', calcularValor);
  pessoasInput.addEventListener('input', calcularValor);
</script>

</body>
</html>
