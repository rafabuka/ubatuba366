<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulador de Reserva 2</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 20px auto;
  }

  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
  }

  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
  }

  .resultado {
    margin-top: 20px;
    padding: 12px;
    background: #f0f0f0;
    font-size: 18px;
    font-weight: bold;
  }

  .aviso {
    margin-top: 10px;
    color: red;
    font-weight: bold;
  }
</style>
</head>

<body>

<h2>Simulador de Reserva</h2>

<label>Data de Entrada</label>
<input type="date" id="entrada">

<label>Hora de Entrada (padrão 14h)</label>
<input type="time" id="horaEntrada" value="14:00">

<label>Data de Saída</label>
<input type="date" id="saida">

<label>Hora de Saída (padrão 13h)</label>
<input type="time" id="horaSaida" value="13:00">

<label>Número de Pessoas</label>
<input type="number" id="pessoas" min="1" value="1">

<div class="resultado" id="valorTotal">Valor: R$ 0,00</div>
<div class="aviso" id="mensagem"></div>

<script>
const VALOR_BASE_2_PESSOAS = 300; // valor base
const ADICIONAL_POR_PESSOA = 50; // percentual convertido em valor fixo
const HORA_PADRAO_ENTRADA = 14;
const HORA_PADRAO_SAIDA = 13;

function calcular() {
  const entrada = new Date(document.getElementById("entrada").value);
  const saida = new Date(document.getElementById("saida").value);
  const horaEntrada = document.getElementById("horaEntrada").value;
  const horaSaida = document.getElementById("horaSaida").value;
  const pessoas = parseInt(document.getElementById("pessoas").value);

  if (!entrada || !saida || entrada >= saida) {
    document.getElementById("valorTotal").innerText = "Valor: R$ 0,00";
    document.getElementById("mensagem").innerText = "";
    return;
  }

  let diarias = Math.ceil((saida - entrada) / (1000 * 60 * 60 * 24));

  // mínimo 2 diárias
  if (diarias < 2) diarias = 2;

  let valorDiaria = VALOR_BASE_2_PESSOAS;

  // 1 pessoa paga como 2
  if (pessoas > 2) {
    valorDiaria += (pessoas - 2) * ADICIONAL_POR_PESSOA;
  }

  let toleranciaUsada = false;
  let extraHorario = 0;

  const horaEnt = parseInt(horaEntrada.split(":")[0]);
  const horaSai = parseInt(horaSaida.split(":")[0]);

  // ENTRADA
  if (horaEnt < HORA_PADRAO_ENTRADA) {
    toleranciaUsada = true;
  }

  // SAÍDA
  if (horaSai > HORA_PADRAO_SAIDA) {
    if (toleranciaUsada) {
      extraHorario = 1;
    } else {
      toleranciaUsada = true;
    }
  }

  const total = (diarias + extraHorario) * valorDiaria;

  document.getElementById("valorTotal").innerText =
    `Valor: R$ ${total.toFixed(2).replace(".", ",")}`;

  document.getElementById("mensagem").innerText =
    extraHorario > 0
      ? "Horário ultrapassou a tolerância. Diária extra aplicada."
      : "";
}

document.querySelectorAll("input").forEach(el =>
  el.addEventListener("change", calcular)
);
</script>

</body>
</html>
